---
# yamllint disable rule:line-length
name: latexmk
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  latexmk:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: yegor256/latexmk-action@0.20.0
        with:
          opts: -pdf
          debs: fonts-noto-core fonts-noto-extra
          depends: DEPENDS.txt
          before: |
            FONTS=$(find /usr/local/texlive -name 'PTSerif-Regular.otf' -type f | head -1)
            if [ -n "$FONTS" ]; then
              cp "$(dirname "$FONTS")"/*.otf /usr/local/share/fonts/
              fc-cache -f
            fi
      - run: |
          mkdir gh-pages
          cp sales-deck.pdf gh-pages
      - uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: gh-pages
          clean: true
        if: github.ref == 'refs/heads/master'
